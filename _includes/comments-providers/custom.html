<!-- start custom comments snippet -->
<style>
  /* Reset site blockquote styles that bleed into the bluesky-comments widget */
  #bluesky-comments-section blockquote {
    font-style: normal;
    border-left: none;
    margin: 0;
    padding: 0;
  }

  /* Remove blanket underline the package applies to all links */
  #bluesky-comments-section a {
    text-decoration: none;
  }

  /* Inline body links (e.g. "replying on Bluesky") get site link colour + underline */
  #bluesky-comments-section a[class*="_link_"] {
    color: var(--global-link-color);
    text-decoration: underline;
  }
  #bluesky-comments-section a[class*="_link_"]:hover {
    color: var(--global-link-color-hover);
  }

  /* Restore margin between comment cards (stripped by the package's own * reset) */
  #bluesky-comments-section [class*="_commentContainer_"] {
    margin: 1rem 0;
  }

  /* Increase indentation of nested reply threads */
  #bluesky-comments-section [class*="_repliesContainer_"] {
    padding-left: 1.5rem;
  }

  /* Bold the author display name, keep the @handle at normal weight */
  #bluesky-comments-section p[class*="_authorName_"] {
    font-weight: bold;
  }
  #bluesky-comments-section span[class*="_handle_"] {
    font-weight: normal;
  }
</style>
<div id="bluesky-comments-section">
  <p id="bluesky-comments-loading" class="small">Loading comments…</p>
</div>

<script type="module">
  import { createElement } from 'react';
  import { createRoot } from 'react-dom/client';
  import { BlueskyComments } from 'https://unpkg.com/bluesky-comments@0.13.1/dist/bluesky-comments.es.js';

  const uri = "{{ page.bluesky_post_uri }}";
  const container = document.getElementById('bluesky-comments-section');
  const loading = document.getElementById('bluesky-comments-loading');

  try {
    const root = createRoot(container);
    root.render(
      createElement(BlueskyComments, {
        uri,
        onEmpty: () => {
          if (loading) loading.remove();
          container.innerHTML =
            '<p class="small">No comments yet — <a href="' + uri +
            '" target="_blank" rel="noopener noreferrer">reply on Bluesky</a> to start the discussion!</p>';
        },
        onLoad: () => {
          if (loading) loading.remove();
        },
      })
    );
  } catch (error) {
    console.error('Error loading Bluesky comments:', error);
    if (container) {
      container.innerHTML =
        '<p class="small">Unable to load comments. <a href="' + uri +
        '" target="_blank" rel="noopener noreferrer">View the discussion on Bluesky</a>.</p>';
    }
  }
</script>
<!-- end custom comments snippet -->
